# Local development stack: Postgres + API + Vite dev server.
#   cp .env.example .env   # optional — only needed for AI features or email
#   docker compose up --build
# Then open http://localhost:5173 (API docs at http://localhost:8000/docs).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: offerflow
      POSTGRES_PASSWORD: offerflow
      POSTGRES_DB: offerflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerflow -d offerflow"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://offerflow:offerflow@db:5432/offerflow
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
